name: Costruisci e pubblica la mappa

on:
  push:
    branches: [main]
    paths: ["data/**", "src/**", "tools/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["data/**", "src/**", "tools/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controlla i dati e costruisci la pagina
        run: python3 tools/build.py --repo "${{ github.repository }}"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
